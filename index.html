<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>サイト模写</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header class="header">
      <div class="header__inner">

        <a href="https://camp.potepan.com/courses/rails-career/" class="header__logo">
          <img src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/header-logo.png" alt="POTEPAN CAMP">
        </a>

        <nav class="header__nav">
          <ul class="header__list">
            <li class="header__item">
              <a href="https://camp.potepan.com/courses/rails-career/#learning-content">
                <span>CONTENT</span>
                <small>学習内容</small>
              </a>
            </li>
            <li class="header__item">
              <a href="https://camp.potepan.com/interview">
                <span>INTERVIEW</span>
                <small>受講生の声</small>
              </a>
            </li>
            <li class="header__item">
              <a href="https://camp.potepan.com/courses/rails-career/#faq">
                <span>FAQ</span>
                <small>よくある質問</small>
              </a>
            </li>
            <li class="header__item">
              <a href="https://camp.potepan.com/recruit">
                <span>RECRUIT</span>
                <small>採用企業様へ</small>
              </a>
            </li>
            <li class="header__item">
              <a href="https://camp.potepan.com/">
                <span>U29</span>
                <small>29歳以下の方へ</small>
              </a>
            </li>
          </ul>
          <a href="https://camp.potepan.com/contact" class="header__button">
            無料カウンセリング
          </a>
        </nav>
      </div>
    </header>


    <section class="first-view">
      <img class="first-view__bg-image first-view__bg-image--left" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/left-rectangle.svg" alt="">
      <img class="first-view__bg-image first-view__bg-image--right" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/right-rectangle.svg" alt="">
      <img class="first-view__bg-image first-view__bg-image--fill" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/fill-rectangle.svg" alt="">
      <img class="first-view__bg-image first-view__bg-image--main" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/main-visual.webp" alt="パソコンで学習する男性">

      <div class="first-view__container">
        <div class="first-view__content">
          <h1 class="first-view__title">
            実践的カリキュラムと<br>
            豊富な提携求人で<br>
            確実にITエンジニアへ
          </h1>

          <img class="first-view__badge" src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/home/first-view/badge.svg" alt="Webエンジニア輩出No.1">

          <a href="https://camp.potepan.com/contact" class="first-view__button">
            まずは無料カウンセリングへ
          </a>

          <p class="first-view__note">
            ※ショッパーズアイ「プログラミングスクール10社を対象にしたサイト比較イメージ調査<br>
            （2020年5月22日～25日）」より全国の22～49歳の男女691名へのインターネット調査
          </p>
        </div>
      </div>

    </section>

  </body>
</html>
